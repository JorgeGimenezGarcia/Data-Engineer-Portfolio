version: 2

models:
  - name: dim_daily_sales
    description: "Business-facing Data Mart aggregating sales metrics by day."
    columns:
      - name: sale_date
        description: "The date of aggregation."
        tests:
          - unique
          - not_null
      
      - name: total_sales_count
        description: "Total number of sales on that day."
        tests:
          - not_null
          # Business logic test: We should never have negative sales
          - dbt.expect_column_values_to_be_of_type:
              column_type: NUMBER
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

      - name: total_revenue
        description: "Total revenue for that day."
        tests:
          - not_null
          - dbt.expect_column_values_to_be_of_type:
              column_type: NUMBER